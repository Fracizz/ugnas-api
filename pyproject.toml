[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugnas-api"
version = "0.3.0"
description = "Unofficial UGOS Pro (绿联云) Python client: login, files, share, space"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ugnas-api contributors" }]
keywords = ["ugnas", "ugos", "ugreen", "nas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.32.0",
  "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "mypy>=1.11",
  "ruff>=0.8",
  "twine>=5.1",
  "types-requests>=2.32",
]

[project.scripts]
ugnas = "ugnas.cli:main"

[project.urls]
Repository = "https://github.com/Fracizz/ugnas-api"
Issues = "https://github.com/Fracizz/ugnas-api/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ugnas = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["BLE", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/ugnas"]

[tool.coverage.report]
show_missing = true
fail_under = 65
